[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-service"
version = "0.1.0"
description = "Détection temps réel : MQTT → features → modèle Orange → backend + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiomqtt>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Plan B : modèle exporté en .joblib (voir tools/export_orange_to_joblib.py)
sklearn = ["scikit-learn>=1.4", "joblib>=1.3"]
# Chargement direct des fichiers .pkcls d'Orange (paquet lourd)
orange = ["orange3>=3.36"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
detection-service = "detection_service.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
